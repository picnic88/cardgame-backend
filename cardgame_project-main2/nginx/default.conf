server {
    listen 80;
    server_name localhost;

    root /var/www/html/cardgame_project;
    index MatchTheCard_GameMainScreen/MainScreen.html;

    location / {
        try_files $uri $uri/ /MatchTheCard_GameMainScreen/MainScreen.html;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
    }

    location /MatchTheCard_GamePlayScreen/ {
        try_files $uri $uri/ /MatchTheCard_GamePlayScreen/GameScreen.html;
    }

    location /MatchTheCard_GameClearScreen/ {
        try_files $uri $uri/ /MatchTheCard_GameClearScreen/ClearScreen.html;
    }

    location /MatchTheCard_GameOverScreen/ {
        try_files $uri $uri/ /MatchTheCard_GameOverScreen/gameoverScreen.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        root /var/www/html/cardgame_project;
        expires 1d;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }

    location ~ \.php$ {
        root /var/www/html;
        include fastcgi_params;
        fastcgi_pass php-backend:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_script_name;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTION' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
    }
}